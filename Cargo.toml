[workspace]
resolver = "3"
members = ["template-manager", "template-manager-codegen"]
default-members = ["template-manager"]

[workspace.package]
name = "template-manager"
description = "A small program for managing programming environment templates"
edition = "2024"
version = "1.0.0"
license = "MIT"
authors = ["Lucas Gager <evest.dev@gmail.com>"]
repository = "https://github.com/Ev357/template-manager"

[workspace.dependencies]
template-manager-codegen = { path = "template-manager-codegen" }

clap = { version = "4.5.52", features = ["derive"] }
clap_complete = "4.5.60"
clap_complete_nushell = "4.5.10"
color-eyre = "0.6.5"
reqwest = { version = "0.13.4", features = ["blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
syn = "3.0.3"
quote = "1.0"

[workspace.lints.clippy]
wildcard_imports = "warn"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
