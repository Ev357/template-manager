[package]
name = "template-manager"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "tm"
path = "src/main.rs"

[dependencies]
template-manager-codegen = { path = "../template-manager-codegen" }
clap = { version = "4.5.52", features = ["derive"] }
clap_complete = "4.5.60"
clap_complete_nushell = "4.5.10"
color-eyre = "0.6.5"
reqwest = { version = "0.13.4", features = ["blocking"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
